server {
    listen 80;
    server_name _;
    charset utf-8;
    charset_types text/html text/plain text/css application/javascript application/json text/javascript;

    client_max_body_size 20m;

    # 现有 dapp-admin 仍请求 /api/admin_dhb；转到本仓 /api/admin_cigc。
    location /api/admin_dhb/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8000/api/admin_cigc/;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8000;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        root /usr/share/nginx/html/dapp;
        try_files $uri $uri/ /index.html;
    }
}
