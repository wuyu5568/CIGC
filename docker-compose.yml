services:
  mysql:
    image: mysql:26.7.0
    container_name: cigc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: cigc
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    container_name: cigc-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CIGC_HTTP_ADDR: ${CIGC_HTTP_ADDR:-0.0.0.0:8000}
      CIGC_DATABASE_DSN: ${CIGC_DATABASE_DSN:-root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/cigc?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27}
      CIGC_JWT_KEY: ${CIGC_JWT_KEY:?set CIGC_JWT_KEY}
      CIGC_ADMIN_USERNAME: ${CIGC_ADMIN_USERNAME:-admin}
      CIGC_ADMIN_PASSWORD: ${CIGC_ADMIN_PASSWORD:?set CIGC_ADMIN_PASSWORD}
      CIGC_GENESIS_ADDRESS: ${CIGC_GENESIS_ADDRESS:-0x8Bd86ad98D9fA366E52CFB5c08a3e33f5f412Fb1}
      CIGC_ALLOW_FORCE_SETTLE: ${CIGC_ALLOW_FORCE_SETTLE:-true}
      CIGC_FULL_DOWNLINE: ${CIGC_FULL_DOWNLINE:-false}
      CIGC_SETTLE_CRON: ${CIGC_SETTLE_CRON:-0 0 * * *}
      CIGC_SETTLE_TIMEZONE: ${CIGC_SETTLE_TIMEZONE:-Asia/Shanghai}
      CIGC_BSC_RPC: ${CIGC_BSC_RPC:-https://bsc-dataseed.binance.org/}
      CIGC_USDT_ADDRESS: ${CIGC_USDT_ADDRESS:-0x55d398326f99059fF775485246999027B3197955}
      CIGC_BUY_CONTRACT: ${CIGC_BUY_CONTRACT:-0x162bfFAcf7a89Bb6EbA05972C1DE0E1e97617c18}
      CIGC_RECEIVE_ADDRESS: ${CIGC_RECEIVE_ADDRESS:-}
      CIGC_RECEIVE_ADDRESSES: ${CIGC_RECEIVE_ADDRESSES:-}
      CIGC_DEPOSIT_CRON: ${CIGC_DEPOSIT_CRON:-"* * * * *"}
      CIGC_DEPOSIT_CONFIRMATIONS: ${CIGC_DEPOSIT_CONFIRMATIONS:-12}
      CIGC_PAYOUT_ENABLED: ${CIGC_PAYOUT_ENABLED:-false}
      CIGC_PAYOUT_CRON: ${CIGC_PAYOUT_CRON:-"* * * * *"}
      CIGC_PAYOUT_MAX_USDT: ${CIGC_PAYOUT_MAX_USDT:-}
      CIGC_HOT_WALLET_KEY: ${CIGC_HOT_WALLET_KEY:-}
      CIGC_UPLOAD_DIR: ${CIGC_UPLOAD_DIR:-/data/uploads}
      TZ: Asia/Shanghai
    volumes:
      - cigc-uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: cigc-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DAPP_DIST:-./deploy/nginx/placeholder/dapp}:/usr/share/nginx/html/dapp:ro
      - ${ADMIN_DIST:-./deploy/nginx/placeholder/admin}:/usr/share/nginx/html/admin:ro
      - cigc-uploads:/usr/share/nginx/html/uploads:ro

volumes:
  mysql-data:
  cigc-uploads:
